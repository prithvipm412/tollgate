openapi: 3.1.0
info:
  title: Tollgate API
  version: 1.0.0
  description: Firewall for AI agents moving money through PayPal. See
    docs/ARCHITECTURE.md and docs/CONTRACT.md.
servers:
  - url: http://localhost:4000
    description: Local gateway
components:
  securitySchemes:
    agentKey:
      type: http
      scheme: bearer
      description: Agent API key, e.g. 'tg_ab12...'
    adminSession:
      type: apiKey
      in: cookie
      name: tg_session
      description: httpOnly session cookie from POST /v1/auth/login
  schemas:
    Money:
      type: object
      properties:
        currency:
          type: string
          enum:
            - USD
        value:
          type: string
      required:
        - currency
        - value
      example:
        currency: USD
        value: "12.50"
    PaymentActionRequest:
      type: object
      properties:
        action_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - payout
            - refund
            - invoice_send
            - order_create
        amount:
          type: object
          properties:
            currency:
              type: string
              enum:
                - USD
            value:
              type: string
              pattern: ^\d+\.\d{2}$
          required:
            - currency
            - value
        counterparty:
          type: object
          properties:
            type:
              type: string
              enum:
                - email
                - paypal_payer_id
                - capture_id
            value:
              type: string
              minLength: 1
            display_name:
              type: string
              minLength: 1
          required:
            - type
            - value
        category:
          type: string
          maxLength: 100
        memo:
          type: string
          maxLength: 500
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        source_context:
          type: array
          items:
            type: string
            maxLength: 4000
          maxItems: 5
        metadata:
          type: object
          additionalProperties:
            type: string
      required:
        - action_id
        - kind
        - amount
        - counterparty
        - reason
    ActionRecord:
      type: object
      properties:
        request:
          type: object
          properties:
            action_id:
              type: string
              format: uuid
            kind:
              type: string
              enum:
                - payout
                - refund
                - invoice_send
                - order_create
            amount:
              type: object
              properties:
                currency:
                  type: string
                  enum:
                    - USD
                value:
                  type: string
                  pattern: ^\d+\.\d{2}$
              required:
                - currency
                - value
            counterparty:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - email
                    - paypal_payer_id
                    - capture_id
                value:
                  type: string
                  minLength: 1
                display_name:
                  type: string
                  minLength: 1
              required:
                - type
                - value
            category:
              type: string
              maxLength: 100
            memo:
              type: string
              maxLength: 500
            reason:
              type: string
              minLength: 1
              maxLength: 2000
            source_context:
              type: array
              items:
                type: string
                maxLength: 4000
              maxItems: 5
            metadata:
              type: object
              additionalProperties:
                type: string
          required:
            - action_id
            - kind
            - amount
            - counterparty
            - reason
        agent_id:
          type: string
          format: uuid
        decision:
          type: object
          properties:
            verdict:
              type: string
              enum:
                - allow
                - hold
                - block
            risk_score:
              type: integer
              minimum: 0
              maximum: 100
            findings:
              type: array
              items:
                type: object
                properties:
                  source:
                    type: string
                    enum:
                      - policy
                      - anomaly
                      - injection
                      - intent
                      - system
                  code:
                    type: string
                    pattern: ^[A-Z][A-Z0-9_]*$
                  severity:
                    type: string
                    enum:
                      - info
                      - warn
                      - hold
                      - block
                  message:
                    type: string
                    minLength: 1
                  evidence:
                    type: string
                required:
                  - source
                  - code
                  - severity
                  - message
            policy_version:
              type: integer
              exclusiveMinimum: 0
            decided_at:
              type: string
              format: date-time
          required:
            - verdict
            - risk_score
            - findings
            - policy_version
            - decided_at
        status:
          type: string
          enum:
            - received
            - blocked
            - pending_approval
            - approved
            - denied
            - expired
            - executing
            - executed
            - failed
        paypal_resource_id:
          type: string
        error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - request
        - agent_id
        - status
        - created_at
        - updated_at
    Agent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - active
            - frozen
        key_prefix:
          type: string
          pattern: ^tg_[A-Za-z0-9]{4,}$
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type:
            - string
            - "null"
          format: date-time
      required:
        - id
        - name
        - status
        - key_prefix
        - created_at
        - last_seen_at
    AgentCreateResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - active
            - frozen
        key_prefix:
          type: string
          pattern: ^tg_[A-Za-z0-9]{4,}$
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type:
            - string
            - "null"
          format: date-time
        api_key:
          type: string
          minLength: 1
      required:
        - id
        - name
        - status
        - key_prefix
        - created_at
        - last_seen_at
        - api_key
    Mandate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        instruction:
          type: string
          minLength: 1
          maxLength: 4000
        policy:
          type: object
          properties:
            version:
              type: number
              enum:
                - 1
            kinds_allowed:
              type: array
              items:
                type: string
                enum:
                  - payout
                  - refund
                  - invoice_send
                  - order_create
              minItems: 1
            limits:
              type: object
              properties:
                per_action_max:
                  type: object
                  properties:
                    currency:
                      type: string
                      enum:
                        - USD
                    value:
                      type: string
                      pattern: ^\d+\.\d{2}$
                  required:
                    - currency
                    - value
                daily_max:
                  type: object
                  properties:
                    currency:
                      type: string
                      enum:
                        - USD
                    value:
                      type: string
                      pattern: ^\d+\.\d{2}$
                  required:
                    - currency
                    - value
                weekly_max:
                  type: object
                  properties:
                    currency:
                      type: string
                      enum:
                        - USD
                    value:
                      type: string
                      pattern: ^\d+\.\d{2}$
                  required:
                    - currency
                    - value
                monthly_max:
                  type: object
                  properties:
                    currency:
                      type: string
                      enum:
                        - USD
                    value:
                      type: string
                      pattern: ^\d+\.\d{2}$
                  required:
                    - currency
                    - value
            approval:
              type: object
              properties:
                require_above:
                  type: object
                  properties:
                    currency:
                      type: string
                      enum:
                        - USD
                    value:
                      type: string
                      pattern: ^\d+\.\d{2}$
                  required:
                    - currency
                    - value
                always_for_kinds:
                  type: array
                  items:
                    type: string
                    enum:
                      - payout
                      - refund
                      - invoice_send
                      - order_create
                new_counterparty:
                  type: boolean
              required:
                - new_counterparty
            counterparties:
              type: object
              properties:
                allow:
                  type: array
                  items:
                    type: string
                    minLength: 1
                deny:
                  type: array
                  items:
                    type: string
                    minLength: 1
            categories:
              type: object
              properties:
                allow:
                  type: array
                  items:
                    type: string
                    minLength: 1
                deny:
                  type: array
                  items:
                    type: string
                    minLength: 1
            velocity:
              type: object
              properties:
                max_actions_per_hour:
                  type: integer
                  exclusiveMinimum: 0
            schedule:
              type: object
              properties:
                days:
                  type: array
                  items:
                    type: string
                    enum:
                      - mon
                      - tue
                      - wed
                      - thu
                      - fri
                      - sat
                      - sun
                  minItems: 1
                start_hour:
                  type: integer
                  minimum: 0
                  maximum: 23
                end_hour:
                  type: integer
                  minimum: 0
                  maximum: 23
                tz:
                  type: string
                  minLength: 1
              required:
                - days
                - start_hour
                - end_hour
                - tz
          required:
            - version
            - kinds_allowed
            - limits
            - approval
            - counterparties
            - categories
            - velocity
        version:
          type: integer
          exclusiveMinimum: 0
        confirmed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
        - id
        - agent_id
        - instruction
        - policy
        - version
        - confirmed_at
        - created_at
